name: 🚀 Build KotuktoperGram iOS18

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 🏗️ Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: 🔧 Clean and stop Gradle
      run: |
        ./gradlew --stop || true
        ./gradlew clean || true
        
    - name: 🏗️ Build Debug APK
      run: |
        chmod +x ./gradlew
        ./gradlew :app:assembleDebug --no-configuration-cache --no-daemon --stacktrace || ./gradlew assembleDebug --no-configuration-cache --no-daemon || ./gradlew build --no-configuration-cache --no-daemon
        
    - name: 🔍 Find APK files
      run: |
        find . -name "*.apk" -type f | head -10
        ls -la app/build/outputs/apk/ || true
        ls -la app/build/outputs/ || true
        
    - name: 📦 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KotuktoperGram-iOS18-APK
        path: |
          **/app/build/outputs/apk/**/*.apk
          **/build/outputs/apk/**/*.apk
          **/*.apk
        if-no-files-found: warn
        retention-days: 30
